<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludobet - Connexion Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #fbf5b7 100%);
            --dark-deep: #050505;
            --dark-card: #151515;
            --gold-solid: #d4af37;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background-color: var(--dark-deep);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            width: 90%;
            max-width: 380px;
            background: var(--dark-card);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .logo { font-size: 1.8rem; font-weight: 900; margin-bottom: 30px; letter-spacing: 2px; }
        .gold { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; color: #888; font-size: 0.8rem; margin-bottom: 8px; margin-left: 5px; }
        
        input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--gold-solid); }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 50px;
            color: black;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .btn-login:active { transform: scale(0.96); }

        #errorMessage {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none; /* Caché par défaut */
        }

        .footer-links { margin-top: 25px; font-size: 0.85rem; color: #666; }
        .footer-links a { color: var(--gold-solid); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">LUDO<span class="gold">BET</span></div>
        
        <div id="errorMessage">ID ou mot de passe incorrect</div>

        <form id="loginForm">
            <div class="form-group">
                <label>ID UTILISATEUR</label>
                <input type="text" id="userid" placeholder="Entrez vos chiffres" required>
            </div>
            <div class="form-group">
                <label>MOT DE PASSE</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Se Connecter</button>
        </form>

        <div class="footer-links">
            <p>Pas encore de compte ? <a href="insc.html">S'inscrire</a></p>
            <br>
            <a href="index.html" style="opacity: 0.5;">Retour à l'accueil</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorMessage');
            errorBox.style.display = 'none'; // On cache l'erreur au début

            const credentials = {
                userid: document.getElementById('userid').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Succès : On stocke les infos localement et on redirige
                    localStorage.setItem('userLoggedIn', 'true');
                    localStorage.setItem('userName', data.user.fullname);
                    alert("✅ Bienvenue " + data.user.fullname);
                    window.location.href = 'index.html';
                } else {
                    // Échec : On affiche le message d'erreur
                    errorBox.innerText = data.message || "Identifiants incorrects";
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                alert("Erreur de connexion au serveur.");
            }
        };
    </script>
</body>
</html>
