<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludobet - Inscription Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #fbf5b7 100%);
            --dark-deep: #050505; --dark-card: #151515; --gold-solid: #d4af37; --input-bg: #1e1e1e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-deep); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { width: 100%; max-width: 400px; background: var(--dark-card); padding: 30px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.2); text-align: center; }
        .gold-txt { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .avatar-section { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .avatar-option { cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .avatar-option.selected { opacity: 1; transform: scale(1.1); }
        .avatar-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--gold-solid); font-size: 2rem; display: flex; align-items: center; justify-content: center; background: #111; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.8rem; color: #888; margin-left: 5px; }
        .input-style { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid #333; border-radius: 8px; color: white; margin-top: 5px; }
        .input-readonly { color: var(--gold-solid); font-family: monospace; cursor: not-allowed; }
        .btn-submit { width: 100%; padding: 15px; border: none; border-radius: 50px; background: var(--gold-gradient); color: #000; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 style="margin-bottom:20px">LUDO<span class="gold-txt">BET</span></h2>
        <form id="registerForm">
            <div class="avatar-section">
                <div class="avatar-option selected" onclick="selectAvatar('male', this)">
                    <div class="avatar-circle">👨</div>
                    <span>Homme</span>
                </div>
                <div class="avatar-option" onclick="selectAvatar('female', this)">
                    <div class="avatar-circle">👩</div>
                    <span>Femme</span>
                </div>
            </div>
            <div class="form-group">
                <label>Nom Complet</label>
                <input type="text" id="fullname" class="input-style" placeholder="Jean Dupont" required>
            </div>
            <div class="form-group">
                <label>ID Utilisateur (Généré)</label>
                <input type="text" id="userid" class="input-style input-readonly" readonly>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="text" id="password" class="input-style input-readonly" readonly>
            </div>
            <button type="submit" class="btn-submit">S'INSCRIRE MAINTENANT</button>
        </form>
    </div>

    <script>
        let selectedAvatar = 'male';
        function selectAvatar(type, el) {
            selectedAvatar = type;
            document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }

        const genID = () => Math.floor(1000000000 + Math.random() * 9000000000).toString();
        const genPass = () => Math.random().toString(36).slice(-10).toUpperCase();

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('userid').value = genID();
            document.getElementById('password').value = genPass();
        });

        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const userData = {
                fullname: document.getElementById('fullname').value,
                userid: document.getElementById('userid').value,
                password: document.getElementById('password').value,
                avatar: selectedAvatar
            };

            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });

            if(res.ok) {
                alert("Compte créé avec succès !");
                window.location.href = "index.html";
            }
        };
    </script>
</body>
</html>
