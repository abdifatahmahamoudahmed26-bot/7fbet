<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludobet - Inscription Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- DESIGN SYSTÈME LUDOBET --- */
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #fbf5b7 100%);
            --dark-deep: #050505;
            --dark-card: #151515;
            --gold-solid: #d4af37;
            --input-bg: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--dark-deep);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--dark-card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .gold-txt {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .avatar-section {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .avatar-option {
            cursor: pointer;
            transition: transform 0.3s;
            text-align: center;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--input-bg);
            font-size: 2rem;
            margin-bottom: 8px;
            transition: all 0.3s;
            overflow: hidden;
        }

        .avatar-option.selected .avatar-circle {
            border-color: var(--gold-solid);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: scale(1.1);
        }

        .avatar-option span { font-size: 0.8rem; color: #888; }
        .avatar-option.selected span { color: var(--gold-solid); }

        .form-group { text-align: left; margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-style {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .input-style:focus { border-color: var(--gold-solid); }

        .input-readonly {
            background: #111;
            color: var(--gold-solid);
            cursor: not-allowed;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 50px;
            background: var(--gold-gradient);
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn-submit:active { transform: scale(0.97); }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover { color: var(--gold-solid); }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-title">LUDO<span class="gold-txt">BET</span></div>
        
        <form id="registerForm">
            <label>Choisir un profil</label>
            <div class="avatar-section">
                <div class="avatar-option selected" onclick="selectAvatar('male', this)">
                    <div class="avatar-circle">👨</div>
                    <span>Homme</span>
                </div>
                <div class="avatar-option" onclick="selectAvatar('female', this)">
                    <div class="avatar-circle">👩</div>
                    <span>Femme</span>
                </div>
            </div>

            <div class="form-group">
                <label for="fullname">Nom Complet</label>
                <input type="text" id="fullname" class="input-style" placeholder="Ex: Jean Dupont" required>
            </div>

            <div class="form-group">
                <label>Votre ID Utilisateur (Chiffres uniquement)</label>
                <input type="text" id="userid" class="input-style input-readonly" readonly>
            </div>

            <div class="form-group">
                <label>Votre Mot de passe (Auto-généré)</label>
                <input type="text" id="password" class="input-style input-readonly" readonly>
            </div>

            <button type="submit" class="btn-submit">S'inscrire Maintenant</button>
        </form>

        <a href="index.html" class="back-link">Retour à l'accueil</a>
    </div>

    <script>
        let selectedAvatar = 'male';

        function selectAvatar(type, element) {
            selectedAvatar = type;
            document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
        }

        // Génération ID (Chiffres uniquement)
        function generateNumbersOnly(length) {
            const digits = '0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += digits.charAt(Math.floor(Math.random() * digits.length));
            }
            return result;
        }

        // Génération Mot de passe (Lettres + Chiffres)
        function generateRandomString(length, useUppercase = false) {
            let chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            if(useUppercase) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // ID : 10 chiffres
            document.getElementById('userid').value = generateNumbersOnly(10);
            // Password : 10 caractères mixtes
            document.getElementById('password').value = generateRandomString(10, true);
        });

        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('fullname').value;
            const uid = document.getElementById('userid').value;
            alert(`🎉 Inscription réussie !\n\nBienvenue ${name}\nVotre ID : ${uid}\nAvatar : ${selectedAvatar}`);
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
