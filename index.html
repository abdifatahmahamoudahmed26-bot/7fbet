<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lido Bet - Premium Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-gradient: linear-gradient(180deg, #fdf5b7 0%, #d4af37 50%, #b38728 100%);
            --dark-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Cadre du téléphone */
        .phone-container {
            width: 375px;
            height: 780px;
            background: radial-gradient(circle at center, #1a1505 0%, #050505 100%);
            border: 4px solid #1f1f1f;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* HEADER PROFESSIONNEL */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 15px 10px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon-circle {
            width: 35px;
            height: 35px;
            border: 1.5px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(212, 175, 55, 0.1);
        }

        .logo-text-top {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 900;
        }

        .auth-buttons {
            display: flex;
            gap: 5px;
        }

        .btn-header {
            background: var(--gold-gradient);
            color: black;
            text-decoration: none;
            font-size: 9px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* TITRE CENTRAL AVEC LIONS */
        .main-title-area {
            text-align: center;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .lion-deco { width: 30px; height: 30px; fill: #d4af37; opacity: 0.8; }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* GRAPHIQUE CENTRAL (DÉS) */
        .center-graphic {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .center-graphic img {
            width: 90%;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        /* BARRE D'ACTION (JOIN NOW / LOG IN) */
        .action-bar {
            width: 85%;
            margin: 0 auto 20px;
            background: #111;
            height: 50px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            border: 1px solid #222;
            overflow: hidden;
        }

        .join-now {
            background: var(--gold-gradient);
            height: 100%;
            flex: 1.3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: 800;
            text-decoration: none;
            font-size: 14px;
            border-radius: 25px;
        }

        .arrow-icon {
            background: black;
            color: #d4af37;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 8px;
            font-size: 12px;
        }

        .log-in-text {
            flex: 0.7;
            text-align: center;
            color: #d4af37;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
        }

        /* MENU BAS (NAVBAR) */
        .navbar {
            background: linear-gradient(to bottom, #151515, #000);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
            border-top: 1px solid #d4af37;
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item svg { width: 22px; height: 22px; fill: #d4af37; }
        .nav-item span { color: #d4af37; font-size: 10px; font-weight: 500; }

    </style>
</head>
<body>

</div>
