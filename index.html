<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7fbet - Pari Football à 7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #28a745;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-gold: #ffdf00;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* En-tête */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 1px solid #333;
        }

        .auth-buttons button {
            background: transparent;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 13px;
            margin-right: 5px;
        }

        .btn-depot {
            background: var(--primary-color) !important;
            border: none !important;
            font-weight: bold;
        }

        /* Zone Centrale */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .big-button {
            width: 100%;
            max-width: 300px;
            height: 120px;
            border-radius: 15px;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .big-button:active { transform: scale(0.95); }

        .btn-friend { background: linear-gradient(45deg, #1e3c72, #2a5298); border-left: 8px solid #00d2ff; }
        .btn-radium { background: linear-gradient(45deg, #8e2de2, #4a00e0); border-left: 8px solid #d633ff; }

        /* Menu de Navigation Bas */
        nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px 0;
            border-top: 1px solid #333;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            text-decoration: none;
            font-size: 11px;
        }

        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary-color); }

        /* Temps réel status */
        #status {
            font-size: 10px;
            text-align: center;
            color: #555;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="auth-buttons">
            <button>S'inscrire</button>
            <button>Se connecter</button>
        </div>
        <button class="auth-buttons"><button class="btn-depot">DÉPÔT</button></button>
    </header>

    <main>
        <button class="big-button btn-friend" onclick="play('FRIEND')">
            <i class="fas fa-users"></i><br>FRIEND
        </button>
        <button class="big-button btn-radium" onclick="play('RADIUM')">
            <i class="fas fa-atom"></i><br>RADIUM
        </button>
    </main>

    <div id="status">Connecté au serveur 7fbet temps réel</div>

    <nav>
        <a href="#" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Recharge</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Paramètre</span>
        </a>
    </nav>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function play(type) {
            console.log("Action temps réel sur : " + type);
            // Envoi de l'action au serveur via Socket.io
            socket.emit('action_pari', { type: type, user: 'test_user' });
            alert("Mode " + type + " sélectionné ! (Temps réel actif)");
        }
    </script>
</body>
</html>
